name: All at once Docker Image Vulnerability Analysis

# 실행 목록에 표시될 이름 (예: Image Group F1 to F20)
run-name: Image Group F${{ inputs.start_f }} to F${{ inputs.end_f }}

on:
  workflow_dispatch:
    inputs:
      start_f:
        description: '시작 그룹 번호 (예: 1)'
        required: true
        default: '1'
      end_f:
        description: '종료 그룹 번호 (예: 5)'
        required: true
        default: '5'

jobs:
  # [1] 숫자 범위를 JSON 배열로 만드는 준비 작업
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: python
        run: |
          import json
          import os

          # 입력값 가져오기
          start = int("${{ github.event.inputs.start_f }}")
          end = int("${{ github.event.inputs.end_f }}")

          # 숫자 배열 생성 [1, 2, 3, ..., 60]
          matrix_range = list(range(start, end + 1))
          
          # GitHub Output에 저장
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix_range)}\n")

  # [2] 실제 분석 작업 (각 번호마다 개별 Job 생성)
  analyze:
    needs: setup
    runs-on: ubuntu-latest
    
    # UI에서 각 Job의 이름에 번호를 표시 (핵심!)
    name: Analysis for Group F${{ matrix.group }}
    
    strategy:
      fail-fast: false # 하나가 실패해도 나머지는 계속 진행
      max-parallel: 5  # 동시에 실행할 최대 Job 개수 (사양에 따라 조절)
      matrix:
        group: ${{ fromJson(needs.setup.outputs.matrix) }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: |
          pip install pandas requests

      - name: Install Analysis Tools
        run: |
          # Grype
          curl -sSfL https://get.anchore.io/grype | sudo sh -s -- -b /usr/local/bin
          # Trivy
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
          # Syft
          curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin
          # OSV Scanner
          curl -L https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner && sudo mv osv-scanner /usr/local/bin/
          # Docker Scout
          mkdir -p ~/.docker/cli-plugins
          curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s -- -b ~/.docker/cli-plugins
          chmod +x ~/.docker/cli-plugins/docker-scout

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Configure rclone
        env:
          ACCESS_TOKEN: ${{ secrets.GDRIVE_ACCESS_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          sudo curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [my_gdrive]
          type = drive
          scope = drive
          token = {"access_token":"$ACCESS_TOKEN","token_type":"Bearer","refresh_token":"$REFRESH_TOKEN","expiry":"2026-03-26T09:24:45.0309538+09:00"}
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Download Scripts from Google Drive
        run: |
          TARGET_FILES=(
            "cleanup_files.py" "docker_delete.py" "docker_inspect.py"
            "docker_pull.py" "docker_size.py" "parse_grype.py" "parse_trivy.py"
            "parse_inspect.py" "parse_osv.py" "parse_scout.py" "run_grype.py"
            "run_scout.py" "run_trivy.py" "run_osv.py" "start_git.sh"
            "git_clone_files.sh" "tvymaster.tar.gz"
          )
          for FILE in "${TARGET_FILES[@]}"; do
            echo "Downloading: $FILE"
            rclone copy "my_gdrive:_docker/$FILE" "./"
            [ -f "./$FILE" ] && chmod +x "./$FILE" || echo "⚠️ $FILE download failed"
          done

      - name: Extract tvymaster
        run: |
          mkdir -p "$HOME/tvy1"
          if [ -f "tvymaster.tar.gz" ]; then
            tar -xzf tvymaster.tar.gz -C "$HOME/tvy1" --strip-components=1
            rm -f tvymaster.tar.gz
          fi

      - name: Get Docker Hub Token & Run Analysis
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          F_VALUE: ${{ matrix.group }}
        run: |
          # API 토큰 획득
          export API_TOKEN2=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKER_USERNAME}\", \"password\": \"${DOCKER_PASSWORD}\"}" \
            | jq -r .token)
          
          echo "🚀 분석 시작 (Group F: $F_VALUE)"
          
          # 스크립트 실행
          chmod +x git_clone_files.sh
          ./git_clone_files.sh "$F_VALUE"
